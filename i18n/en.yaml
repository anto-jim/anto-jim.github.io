## Homepage about
- id: "about_title"
  translation: "Who am I?"

- id: "about_content"
  translation:  <p class="lead">
      I am an AI Business Analyst at Qaracter working on AI solutions and agentic process automation in financial services. I combine requirements and delivery work with hands-on integration (Spring Boot, Kafka, TIBCO), Camunda / Spring Boot systems for regulatory reporting (using Devin as an AI coding/assistant tool to implement and test), and a production Camunda + ChatGPT email workflow.
      </p>
      <p class="lead">
      Oracle Agentic AI Certified Foundations Associate; completed a Master’s in Software Engineering and Artificial Intelligence (SE+AI) in September 2026, including a MARL / OpenSpiel thesis (forthcoming on Riuma). Spanish — Native; English — Bilingual (Cambridge C2 Proficiency, score 220).
    </p>

